    <link rel="stylesheet" href="style.css">

        rel="stylesheet">

<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <a href="#" class="nav-logo">
            <span>⛽</span> FuelFinder
        </a>
        <input type="checkbox" class="hamburger-toggle" id="menuToggle">
        <label for="menuToggle" class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <ul class="nav-links" id="navLinks">
            <li><a href="#hero">Home</a></li>
            <li><a href="#fuel-selector">Find Fuel</a></li>
            <li><a href="#map-section">Stations</a></li>
            <li><a href="#booking-section">Book Gas</a></li>
            <li><a href="#history-section">History</a></li>
            <li><a href="#reviews-section">Reviews</a></li>
        </ul>
        <div class="nav-right">
            <button class="btn-location" onclick="detectLocation()">
                📍 Use My Location
            </button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" title="Toggle Theme">
                <span id="themeToggleIcon">🌙</span>
            </button>
            <span class="region-pill">India 🇮🇳</span>

            <!-- Settings Icon -->
            <div class="settings-icon" onclick="toggleSettings()">
                ⚙️
            </div>

             <!-- Settings Panel -->
            <div id="settingsPanel" class="settings-panel">
                <div class="panel-header">
                    <h3>Settings</h3>
                    <button class="close-btn" onclick="toggleSettings()">✕</button>
                </div>
                <div class="panel-menu">
                    <div class="menu-item" data-type="info" onclick="showContent('info')">
                        <span class="menu-icon">👤</span>
                        <span class="menu-text">Your Info</span>
                    </div>
                    <div class="menu-item" data-type="notifications" onclick="showContent('notifications')">
                        <span class="menu-icon">🔔</span>
                        <span class="menu-text">Notifications</span>
                    </div>
                    <div class="menu-item" data-type="privacy" onclick="showContent('privacy')">
                        <span class="menu-icon">🔒</span>
                        <span class="menu-text">Privacy & Security</span>
                    </div>
                    <div class="menu-item" data-type="about" onclick="showContent('about')">
                        <span class="menu-icon">ℹ️</span>
                        <span class="menu-text">About</span>
                    </div>
                    <div class="menu-item" data-type="help" onclick="showContent('help')">
                        <span class="menu-icon">❓</span>
                        <span class="menu-text">Help & Feedback</span>
                    </div>
                    <div class="menu-item sign-out" onclick="logout()">
                        <span class="menu-icon">🚪</span>
                        <span class="menu-text">Sign Out</span>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="contentArea">
                        <div class="content-header">
                            <h2>⚙️ Settings</h2>
                            <p>Manage your account preferences and explore app features</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
